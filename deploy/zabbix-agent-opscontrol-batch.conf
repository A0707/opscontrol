# Paramètres utilisateur de l'agent Zabbix : résultats des batchs OpsControl.
# À copier dans /etc/zabbix/zabbix_agentd.d/opscontrol-batch.conf (Debian et
# CentOS : même dossier, déjà inclus par zabbix_agentd.conf), puis redémarrer
# l'agent. Compatible agent 4.0 (srv-batch-02) et 6.4 (srv-batch-01).
#
# Lecture seule : ces commandes lisent /var/lib/opscontrol-batch/*.state et
# n'exécutent rien d'autre. Le nom de batch est validé par le script avant
# tout accès fichier (lettres, chiffres, _ . - ; pas de chemin).
UserParameter=opscontrol.batch.discovery,/usr/local/bin/opscontrol-batch-report --discovery
UserParameter=opscontrol.batch.rc[*],/usr/local/bin/opscontrol-batch-report --get "$1" rc
UserParameter=opscontrol.batch.started[*],/usr/local/bin/opscontrol-batch-report --get "$1" started
UserParameter=opscontrol.batch.finished[*],/usr/local/bin/opscontrol-batch-report --get "$1" finished
UserParameter=opscontrol.batch.duration[*],/usr/local/bin/opscontrol-batch-report --get "$1" duration
